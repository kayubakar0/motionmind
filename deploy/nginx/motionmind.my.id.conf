# MotionMind — server block untuk nginx host (motionmind.my.id).
# Cara pakai: sudo cp deploy/nginx/motionmind.my.id.conf /etc/nginx/sites-available/motionmind.my.id
# lalu sudo nginx -t && sudo systemctl reload nginx
# Baris ssl_* : salin dari blok 443 yang sudah dibuat certbot (--nginx) di VPS kamu
# (cek: sudo grep -rn "ssl_certificate" /etc/nginx/sites-enabled/)
server {
    listen 80;
    listen [::]:80;
    server_name motionmind.my.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name motionmind.my.id;

    ssl_certificate /etc/letsencrypt/live/motionmind.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motionmind.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 33m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
